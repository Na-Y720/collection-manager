<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#111827" />
  <meta name="description" content="個人用コレクション管理アプリ" />
  <title>My Collection Manager</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main id="appView" class="app-shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">PERSONAL COLLECTION</div>
        <h1>マイコレクション</h1>
        <p class="local-note">この端末内に保存する個人用モード</p>
      </div>
      <div class="data-actions">
        <button id="backupButton" class="secondary" type="button">バックアップ</button>
        <button id="importButton" class="secondary" type="button">復元</button>
        <button id="csvButton" class="secondary" type="button">CSV出力</button>
        <button id="apiSettingsButton" class="secondary" type="button">楽天API設定</button>
        <input id="importFile" type="file" accept="application/json,.json" class="hidden" />
      </div>
    </header>

    <div id="pageError" class="error-box page-error hidden"></div>
    <div id="pageSuccess" class="success-box page-error hidden"></div>

    <section id="apiSettingsCard" class="form-card api-settings hidden">
      <div class="section-heading">
        <div><span class="eyebrow">RAKUTEN API</span><h2>JAN商品情報取得の設定</h2></div>
        <button id="closeApiSettingsButton" class="icon-button" type="button" aria-label="閉じる">×</button>
      </div>
      <div class="form-grid">
        <label>App ID<input id="rakutenAppId" autocomplete="off" placeholder="楽天Web ServiceのApp ID" /></label>
        <label>Access Key<input id="rakutenAccessKey" type="password" autocomplete="off" placeholder="Access Key" /></label>
        <div class="span-2 api-help">キーはこのPCのブラウザ内だけに保存します。GitHubやバックアップJSONには含めません。</div>
        <div class="form-actions span-2">
          <button id="clearApiSettingsButton" class="secondary" type="button">設定削除</button>
          <button id="saveApiSettingsButton" class="primary" type="button">保存</button>
        </div>
      </div>
    </section>

    <section class="summary-grid">
      <article class="summary-card"><span>購入総額</span><strong id="purchaseTotal">¥0</strong><small id="purchaseKnownCount">0/0商品の購入額を設定済み</small></article>
      <article class="summary-card"><span>現在評価額</span><strong id="currentTotal">¥0</strong><small id="valuedCount">0/0商品を評価済み</small></article>
      <article class="summary-card"><span>評価済み損益</span><strong id="profitTotal">¥0</strong><small id="profitRate">購入額と現在相場が揃うと表示</small></article>
      <article class="summary-card"><span>保有数</span><strong id="unitTotal">0 個</strong><small id="itemCount">0登録</small></article>
    </section>

    <section class="toolbar">
      <input id="searchInput" class="search" placeholder="商品名・JAN・カテゴリで検索" />
      <button id="addButton" class="primary" type="button">＋ コレクション登録</button>
    </section>

    <section id="formCard" class="form-card hidden">
      <div class="section-heading">
        <div><span id="formEyebrow" class="eyebrow">NEW</span><h2 id="formTitle">コレクションを登録</h2></div>
        <button id="closeFormButton" class="icon-button" type="button" aria-label="閉じる">×</button>
      </div>
      <form id="collectionForm" class="form-grid">
        <label class="span-2">商品名<input id="name" required placeholder="例：30th CELEBRATION BOX" /></label>
        <label>JANコード
          <div class="jan-input-actions">
            <input id="janCode" inputmode="numeric" placeholder="JANを入力" />
            <button id="janLookupButton" class="lookup-button" type="button" title="JANから商品情報取得">商品情報取得</button>
            <button id="scanButton" class="scan-button" type="button" title="カメラでJAN読取">📷</button>
          </div>
          <small id="janLookupMessage" class="scanner-message hidden"></small>
          <small id="scannerMessage" class="scanner-message hidden"></small>
        </label>
        <label>カテゴリ<input id="category" placeholder="ポケカ / フィギュア等" /></label>
        <label>購入日<input id="purchaseDate" type="date" /></label>
        <label>定価（1個）<input id="listPrice" type="number" min="0" step="1" placeholder="JAN取得または手入力" /></label>
        <label>購入単価<input id="purchasePrice" type="number" min="0" step="1" placeholder="5980" /></label>
        <label>個数<input id="quantity" type="number" min="1" step="1" value="1" /></label>
        <label>現在相場（1個）<input id="currentPrice" type="number" min="0" step="1" placeholder="未入力でもOK" /></label>
        <label class="span-2">メモ<textarea id="memo" rows="3" placeholder="シュリンクあり、保管場所など"></textarea></label>
        <div class="form-actions span-2">
          <button id="cancelButton" class="secondary" type="button">キャンセル</button>
          <button id="saveButton" class="primary" type="submit">登録する</button>
        </div>
      </form>
    </section>

    <section id="emptyState" class="empty-state hidden">
      <strong id="emptyTitle">まだコレクションがありません</strong>
      <span id="emptyText">最初の商品を登録してみましょう。</span>
    </section>
    <section id="itemGrid" class="item-grid"></section>
  </main>

  <div id="scannerOverlay" class="scanner-overlay hidden">
    <div class="scanner-card">
      <video id="scannerVideo" playsinline muted></video>
      <div class="scanner-guide">JANコードをカメラ中央に入れてください</div>
      <button id="stopScanButton" class="secondary" type="button">閉じる</button>
    </div>
  </div>
  <script src="./app.js"></script>
</body>
</html>
